
name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          mkdir /tmp/project
          unzip -q firewood-landing.zip -d /tmp/project

          ROOT=$(find /tmp/project -type f -name package.json -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name firewood-landing.zip -exec rm -rf {} +

          cp -r "$ROOT"/. .
          rm firewood-landing.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project structure"
          git push

# workflow refresh
